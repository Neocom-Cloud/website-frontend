name: Deploy to AWS

# The site is hosted on AWS only: a private S3 bucket behind CloudFront.
#   develop -> preview    (served on its own CloudFront domain)
#   deploy  -> production (neocom.cloud)
# Each target has its own bucket, distribution, GitHub environment and IAM
# role, and the role's trust policy accepts only tokens issued for that
# environment. No access key is stored anywhere.

on:
  push:
    branches:
      - develop
      - deploy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel a sync half way: a partial upload would leave a mixed site.
  group: aws-site-${{ github.ref_name }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  # None of these are secrets. They come from `terraform output` of the
  # terraform-site and terraform-site-bootstrap stacks (see infra/README.md).
  AWS_ROLE_ARN: ${{ github.ref == 'refs/heads/deploy' && 'arn:aws:iam::431915868573:role/neocom-site-production-github' || 'arn:aws:iam::431915868573:role/neocom-site-preview-github' }}
  SITE_BUCKET: ${{ github.ref == 'refs/heads/deploy' && 'neocom-site-production' || 'neocom-site-preview' }}
  DISTRIBUTION_ID: ${{ github.ref == 'refs/heads/deploy' && 'EDTRWBXZ0WVRY' || 'E3MC3T7OTOQKZ5' }}
  # The smoke test always goes through the CloudFront domain, which works
  # whatever the DNS says, so a DNS problem cannot fail a healthy publish.
  SMOKE_URL: ${{ github.ref == 'refs/heads/deploy' && 'https://d2bmtl9y1doakb.cloudfront.net' || 'https://d2ogykvptv4dgl.cloudfront.net' }}
  SITE_URL: ${{ github.ref == 'refs/heads/deploy' && 'https://neocom.cloud' || 'https://d2ogykvptv4dgl.cloudfront.net' }}

jobs:
  build:
    name: Build and verify
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository integrity
        run: pnpm verify:repository

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:ci

      - name: Build
        run: pnpm build

      - name: Verify deployment output
        run: pnpm test:build-output

      - name: Upload site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: site-dist
          path: ./dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish to S3 and invalidate CloudFront
    needs: build
    runs-on: ubuntu-latest
    # The IAM trust policy only accepts tokens issued for this environment.
    # Add required reviewers to site-production in the repository settings if
    # production should wait for an approval.
    environment:
      name: ${{ github.ref == 'refs/heads/deploy' && 'site-production' || 'site-preview' }}
      url: ${{ env.SITE_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: site-dist
          path: ./dist

      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Vite fingerprints js, css and fonts, so they can be cached for a year.
      # Everything else under assets/ keeps its name and must revalidate sooner.
      - name: Upload fingerprinted assets
        run: |
          aws s3 sync dist/ "s3://${SITE_BUCKET}/" \
            --exclude "*" \
            --include "assets/*.js" --include "assets/*.css" \
            --include "assets/*.woff" --include "assets/*.woff2" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload pages and other files
        run: |
          aws s3 sync dist/ "s3://${SITE_BUCKET}/" \
            --exclude "assets/*.js" --exclude "assets/*.css" \
            --exclude "assets/*.woff" --exclude "assets/*.woff2" \
            --exclude "*.html" \
            --cache-control "public,max-age=3600"
          aws s3 sync dist/ "s3://${SITE_BUCKET}/" \
            --exclude "*" --include "*.html" \
            --cache-control "public,max-age=0,must-revalidate"

      # Last, so a failed upload never leaves the site missing files. Objects
      # just uploaded are newer than the local copies and are not re-sent.
      - name: Remove files that no longer exist
        run: aws s3 sync dist/ "s3://${SITE_BUCKET}/" --delete

      - name: Invalidate CloudFront
        id: invalidate
        run: |
          id=$(aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" --paths '/*' \
            --query Invalidation.Id --output text)
          echo "id=${id}" >> "$GITHUB_OUTPUT"

      - name: Wait for the invalidation
        run: |
          aws cloudfront wait invalidation-completed \
            --distribution-id "${DISTRIBUTION_ID}" --id "${{ steps.invalidate.outputs.id }}"

      - name: Smoke test
        run: |
          set -eu
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${SMOKE_URL}$1")
            echo "$1 -> ${code} (expected $2)"
            [ "${code}" = "$2" ]
          }
          check / 200
          check /pt-br/ 200
          check /en/ 200
          check /this-page-does-not-exist/ 404
